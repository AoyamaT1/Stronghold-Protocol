<!doctype html><html><head><meta charset="utf-8"><title>PENDING</title></head>
<body><pre id="out">running…</pre></body>
<script src="/vendor/pixi.min.js"></script><script src="/vendor/pixi-spine.js"></script>
<script>
const NAMES=['yisang','faust','donquixote','ryoshu','meursault','honglu','heathcliff','ishmael','rodion','sinclair','outis','gregor'];
const out=[]; const log=s=>out.push(s);
const S=300/320;
async function one(app,n){
  const url=`/assets/spine/op/char_limbus_${n}/front/${n}.json`;
  try{
    const res=await PIXI.Assets.load(url); const d=res&&(res.spineData||res);
    const sp=new PIXI.spine.Spine(d);
    sp.scale.set(S); sp.position.set(400,700);
    const stage=new PIXI.Container(); stage.addChild(sp);
    app.renderer.render(stage);
    const px=app.renderer.extract.pixels(stage);
    let nz=0; for(let i=3;i<px.length;i+=4) if(px[i]>8) nz++;
    const b=sp.getBounds(); sp.update(0.016);
    log(`${n.padEnd(11)} 像素${String(nz).padStart(6)} 高度${(sp.height*S).toFixed(0)}px(${(sp.height*S/300).toFixed(2)}格) 包围盒 ${b.width.toFixed(0)}x${b.height.toFixed(0)} ${nz>500?'OK':'✗ 画不出来'}`);
    sp.destroy({children:true,texture:false,baseTexture:false});
  }catch(e){ log(`${n.padEnd(11)} ERROR ${e.message}`); }
}
async function main(){
  const app=new PIXI.Application({width:800,height:800,backgroundAlpha:0,preserveDrawingBuffer:true});
  document.body.appendChild(app.view);
  for(const n of NAMES) await one(app,n);
  document.getElementById('out').textContent=out.join('\n'); document.title='DONE';
}
main();
</script></html>
