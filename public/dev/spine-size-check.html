<!doctype html><html><head><meta charset="utf-8"><title>PENDING</title></head>
<body><pre id="out">running…</pre></body>
<script src="/vendor/pixi.min.js"></script><script src="/vendor/pixi-spine.js"></script>
<script>
const out=[]; const log=s=>out.push(s);
async function measure(tag,url){
  try{
    const res=await PIXI.Assets.load(url); const d=res&&(res.spineData||res);
    // setup pose 的包围盒：遍历默认皮肤里所有 region 附件的宽高做粗估
    let maxH=0,maxW=0;
    const sk=d.defaultSkin;
    if(sk&&sk.attachments) for(const i in sk.attachments) for(const n in sk.attachments[i]){
      const a=sk.attachments[i][n]; const r=a.region||(a.regions&&a.regions[0]);
      if(r){maxH=Math.max(maxH,r.height||0);maxW=Math.max(maxW,r.width||0);}
    }
    log(`${tag}\n  画布: w=${d.width} h=${d.height}  x=${d.x} y=${d.y}\n  bones=${d.bones.length} slots=${d.slots.length}\n  最大附件: ${maxW.toFixed(0)} x ${maxH.toFixed(0)}`);
  }catch(e){ log(tag+' ERROR '+e.message); }
}
async function main(){
  await measure('方舟 char_003_kalts','/assets/spine/op/char_003_kalts/front/char_003_kalts.skel');
  await measure('方舟 敌人 enemy_10001','/assets/spine/enemy/enemy_10001_trslim/enemy_10001_trslim.skel');
  await measure('边狱 李箱','/assets/spine/op/char_limbus_yisang/front/yisang.json');
  await measure('边狱 默尔索','/assets/spine/op/char_limbus_meursault/front/meursault.json');
  await measure('边狱 以实玛利','/assets/spine/op/char_limbus_ishmael/front/ishmael.json');
  document.getElementById('out').textContent=out.join('\n\n'); document.title='DONE';
}
main();
</script></html>
